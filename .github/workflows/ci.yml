name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: jupyter nbconvert --execute --to notebook --output /tmp/hotel-booking-validated.ipynb hotel_booking_business_analytics_report.ipynb --ExecutePreprocessor.timeout=900
