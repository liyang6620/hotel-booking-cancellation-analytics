name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Rebuild the complete model evidence bundle
        run: python scripts/train_model.py
      - name: Execute the ML evidence notebook
        run: >-
          python -m nbconvert --execute --to notebook
          --output /tmp/hotel-booking-validated.ipynb
          hotel_booking_ml_evidence.ipynb
          --ExecutePreprocessor.timeout=300
